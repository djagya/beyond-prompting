# Example docker compose file for a self-hosted Hermes Agent gateway.
#
# EXAMPLE ONLY — adapt it and verify every line against the official Docker
# documentation for the image version you deploy:
#   https://hermes-agent.nousresearch.com/docs/user-guide/docker
#
# Labels used below:
#   [official]  documented by the official Docker page at the time of writing
#   [practice]  operator practice from a long-running home deployment; not an
#               upstream guarantee — re-check on your version
#
# Companion guide: guides/setup-reference.en.md (section 4 explains the why).
#
# Placeholders to replace:
#   <version>, <digest>   image tag and registry digest you reviewed
#   ./data/hermes         host directory holding all runtime state (gitignored)
#   1000:1000             uid:gid of the host user that owns ./data/hermes

name: hermes-stack

x-logging: &logging
  # [practice] Docker's default json-file driver never rotates; bound it.
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  hermes:
    # [practice] Pin tag AND digest. The tag is for humans; the digest is what
    # runs. `docker compose pull` then cannot move you silently — a pin change
    # becomes a reviewed commit. Get the digest with:
    #   docker buildx imagetools inspect nousresearch/hermes-agent:<version>
    image: "nousresearch/hermes-agent:<version>@sha256:<digest>"
    container_name: hermes
    restart: unless-stopped

    # [official] Runs the supervised gateway (s6-overlay keeps it alive).
    command: ["gateway", "run"]

    # [official+practice] The image's /init must start as root: it remaps the
    # in-container `hermes` user to HERMES_UID/HERMES_GID and fixes volume
    # ownership, then drops privileges for every service. Explicit here so
    # nobody "hardens" it to a non-root user and breaks the remap.
    # Do NOT override `entrypoint`.
    user: "0:0"

    # [practice] No `no-new-privileges` on this service: the uid remap and the
    # privilege drop need setuid. Instead drop every capability and re-add
    # only what remap + drop + service stop use. If the container fails to
    # boot after an image bump, suspect this block first.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - SETUID
      - SETGID
      - KILL
    # If you enable a sandbox that needs user namespaces (e.g. bubblewrap),
    # extend Docker's default seccomp profile with only the syscalls it needs.
    # Never use `seccomp=unconfined`.
    # security_opt:
    #   - seccomp:./hermes/seccomp-custom.json

    environment:
      TZ: ${TZ:-UTC}
      # [official] Remap to the host user that owns ./data/hermes so files the
      # agent writes and files your host-side scripts (backup, git) write share
      # ownership. The image default is uid 10000.
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # [official] Container-side home of all state. Hermes reads its own
      # ${HERMES_HOME}/.env for provider and platform keys.
      HERMES_HOME: /opt/data

      # [practice] Shutdown budget. s6 kills leftover processes a few seconds
      # after SIGTERM by default; a gateway draining in-flight turns needs
      # longer, and a SIGKILL mid-write is how the SQLite session store gets
      # corrupted. Keep both below stop_grace_period so s6, not dockerd,
      # decides. Values are milliseconds; size them to your drain timeout.
      S6_SERVICES_GRACETIME: "150000"
      S6_KILL_GRACETIME: "150000"

      # [practice] Subprocess secrets via passthrough: values live in the
      # repo-root .env on the host (never in git, never in config.yaml).
      # Children spawned by the terminal tool inherit PID 1's environment
      # unless the name is on Hermes' infrastructure blocklist; check
      # `terminal.env_passthrough` in the security docs for your backend.
      # EXAMPLE_SERVICE_API_KEY: ${EXAMPLE_SERVICE_API_KEY:-}

      # [official] Only if you mount an extra workspace: the image confines
      # write_file/patch to ${HERMES_HOME} by default. List every root.
      # HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace

      # [official] The OpenAI-compatible API server (and its health endpoint)
      # is off unless enabled; to reach it through the published port it must
      # bind 0.0.0.0 inside the container and carry a key (keep the key in
      # ${HERMES_HOME}/.env, not here).
      # API_SERVER_ENABLED: "true"
      # API_SERVER_HOST: "0.0.0.0"

    volumes:
      # [official] All mutable state: config, .env, sessions, memories,
      # skills, cron, logs. Gitignored on the host; backed up separately.
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      # Optional workspace. If you also set `working_dir` to it, Hermes loads
      # that directory's AGENTS.md / CLAUDE.md / .cursor rules as project
      # context — shield it with a NON-EMPTY .hermes.md (an empty one falls
      # through to the next file).
      # - ${WORKSPACE_DIR:-./workspace}:/workspace
    # working_dir: /workspace

    # [practice] Loopback only. Docker-published ports bypass host firewalls
    # such as ufw (Docker's NAT rules run first), so "0.0.0.0" here means
    # "reachable from every network the host is on". Expose through an
    # authenticated private ingress (e.g. Tailscale Serve) instead.
    ports:
      - "127.0.0.1:${HERMES_GATEWAY_PORT:-8642}:8642"

    # [practice] Chromium needs a large /dev/shm; the default 64 MB crashes tabs.
    shm_size: "1g"

    # [practice] Default soft nofile (1024) runs out once MCP servers,
    # browsers, websockets and streaming responses stack up.
    ulimits:
      nofile:
        soft: 8192
        hard: 65535

    deploy:
      resources:
        limits:
          # [practice] Size to your host; leave room for the OS page cache.
          memory: ${HERMES_MEM_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"
          # [practice] Fork-storm brake. Leaked browser tabs plus MCP servers
          # can exhaust a low cap ("can't start new thread"); raise it rather
          # than removing it. Must be a literal integer, not ${VAR}.
          pids: 4096

    # [practice] Must exceed the s6 budgets above so the gateway and SQLite
    # finish draining before dockerd sends SIGKILL. Docker's default is 10s.
    stop_grace_period: 360s

    # [practice] Observability only: Docker does not restart an unhealthy
    # container. Green health is not "working" — also probe chat, cron and MCP.
    # Verify which probe your image ships; /health answers only when the API
    # server is enabled.
    # healthcheck:
    #   test: ["CMD", "<probe-command-your-image-ships>"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10m   # first boot may run schema migrations

    logging: *logging

  # ---------------------------------------------------------------------------
  # Optional sidecars — commented out. Read the rules before enabling one.
  #
  # ONE GATEWAY PER DATA DIRECTORY. Never start a second container from the
  # Hermes image against ./data/hermes (for example a "dashboard" container):
  # its supervisor can start a second gateway on the same bot token, which
  # shows up as polling conflicts and silently dropped messages. The official
  # dashboard runs inside the same container (HERMES_DASHBOARD=1, with an auth
  # provider configured, port bound to 127.0.0.1).
  #
  # Web UI (community or your own):
  #   - must proxy chat through the gateway, never run its own agent process
  #     against the same data directory;
  #   - bind 127.0.0.1, require a strong password, expose via private ingress;
  #   - no `depends_on: hermes` — `compose up webui` would then recreate the
  #     gateway as a side effect;
  #   - pin it by digest like the gateway.
  #
  # webui:
  #   image: "<webui-image>:<version>@sha256:<digest>"
  #   ports:
  #     - "127.0.0.1:8787:8787"
  #   environment:
  #     WEBUI_PASSWORD: ${WEBUI_PASSWORD:?set in .env}
  #   security_opt:
  #     - no-new-privileges:true
  #   restart: unless-stopped
  #   logging: *logging
  #
  # Log viewer (Dozzle or similar):
  #   - a mounted Docker socket is root on the host even with `:ro` (the flag
  #     protects the socket file, not the API behind it);
  #   - disable container actions, require auth, bind 127.0.0.1, or put a
  #     read-only Docker socket proxy in front of it.
  #
  # logs:
  #   image: "<log-viewer-image>:<version>@sha256:<digest>"
  #   ports:
  #     - "127.0.0.1:9999:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   security_opt:
  #     - no-new-privileges:true
  #   restart: unless-stopped
  #   logging: *logging
  #
  # Browsers: run Chromium/Playwright in separate containers, not inside the
  # gateway's cgroup, so a tab leak cannot take the gateway down.
